<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>MiCheck - Detalle</title>
</head>
<body>
<div layout:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 th:text="${entrada.nombre}"></h2>
      <span class="badge bg-primary" th:text="${entrada.tipo.nombre}"></span>
      <span th:if="${entrada.tipo.tieneTemporadas}" class="badge bg-secondary" th:text="'Temporada ' + ${entrada.temporada}"></span>
    </div>
    <a href="/entradas" class="btn btn-outline-secondary">← Volver</a>
  </div>

  <div class="row">
    <div class="col-md-3 mb-2" th:each="episodio, i : ${entrada.episodios}">
      <form th:action="@{/entradas/{indice}/episodios/{eIndice}(indice=${indice}, eIndice=${i.index})}" method="post">
        <div class="card" th:classappend="${episodio.visto} ? 'border-success bg-success bg-opacity-10' : ''">
          <div class="card-body d-flex align-items-center">
            <input type="checkbox"
                   class="form-check-input me-2"
                   th:checked="${episodio.visto}"
                   onchange="this.form.submit()"/>
            <span th:text="${entrada.tipo.nombreUnidad} + ' ' + ${episodio.numero}"></span>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
