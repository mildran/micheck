html<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>MiCheck - Entradas</title>
</head>
<body>
<div layout:fragment="content">
  <h2 class="mb-4">Entradas</h2>

  <!-- Pestañas por categoría -->
  <ul class="nav nav-tabs mb-4">
    <li class="nav-item">
      <a class="nav-link" th:classappend="${categoriaIndice == null} ? 'active' : ''"
         href="/entradas">Todos</a>
    </li>
    <li class="nav-item" th:each="categoria, i : ${categorias}">
      <a class="nav-link" th:classappend="${categoriaIndice == i.index} ? 'active' : ''"
         th:href="@{/entradas(categoriaIndice=${i.index})}"
         th:text="${categoria.nombre}">
      </a>
    </li>
  </ul>

  <!-- Formulario nueva entrada -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Nueva Entrada</h5>
      <form th:action="@{/entradas}" th:object="${entrada}" method="post" class="row g-3">
        <div class="col-md-2">
          <select th:field="*{tipo}" class="form-select">
            <option value="">-- Categoría --</option>
            <option th:each="categoria, i : ${categorias}"
                    th:value="${i.index}"
                    th:text="${categoria.nombre}">
            </option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre"/>
        </div>
        <div class="col-md-1">
          <input type="number" name="numeroTemporada" value="1" class="form-control" placeholder="Temporada"/>
        </div>
        <div class="col-md-1">
          <input type="number" name="numeroUnidades" class="form-control" placeholder="Nº episodios"/>
        </div>
        <div class="col-md-4">
          <input type="text" th:field="*{observaciones}" class="form-control" placeholder="Observaciones"/>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">Añadir</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lista de entradas -->
  <div class="row row-cols-1 row-cols-md-3 g-3">
    <div class="col" th:each="entrada, i : ${entradas}">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title" th:text="${entrada.nombre}"></h5>
          <p class="card-text">
            <span class="badge bg-primary" th:text="${entrada.tipo.nombre}"></span>
            <span th:if="${entrada.tipo.tieneTemporadas}" th:text="' · ' + ${entrada.temporadas.size()} + ' temporada(s)'"></span>
            <br/>
            <small th:text="${entrada.totalUnidades} + ' ' + ${entrada.tipo.nombreUnidad} + 's en total'"></small>
            <br/>
            <small class="text-muted" th:text="${entrada.observaciones}"></small>
          </p>
        </div>
        <div class="card-footer">
          <a th:href="@{/entradas/{indice}(indice=${i.index})}" class="btn btn-primary btn-sm me-2">Ver</a>
          <a th:href="@{/entradas/eliminar/{indice}(indice=${i.index})}" class="btn btn-danger btn-sm">Eliminar</a>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-3 mb-2" th:each="episodio : ${episodios}">
      <form th:action="@{/entradas/{indice}/temporadas/{tIndice}/episodios/{eIndice}(indice=${indice}, tIndice=${tIndice}, eIndice=${episodio.numero - 1})}" method="post">
        <div class="card" th:classappend="${episodio.visto} ? 'border-success bg-success bg-opacity-10' : ''">
          <div class="card-body d-flex align-items-center">
            <input type="checkbox"
                   class="form-check-input me-2"
                   th:checked="${episodio.visto}"
                   onchange="this.form.submit()"/>
            <span th:text="${entrada.tipo.nombreUnidad} + ' ' + ${episodio.numero}"></span>
          </div>
        </div>
      </form>
    </div>
  </div>

</div>
</body>
</html>
