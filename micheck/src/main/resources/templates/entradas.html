<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>MiCheck - Entradas</title>
</head>
<body>
<div layout:fragment="content">
  <h2 class="mb-4">Entradas</h2>

  <!-- Pestañas por tipo -->
  <ul class="nav nav-tabs mb-4">
    <li class="nav-item">
      <a class="nav-link" th:classappend="${tipoIndice == null} ? 'active' : ''"
         href="/entradas">Todos</a>
    </li>
    <li class="nav-item" th:each="tipo, i : ${tipos}">
      <a class="nav-link" th:classappend="${tipoIndice == i.index} ? 'active' : ''"
         th:href="@{/entradas(tipoIndice=${i.index})}"
         th:text="${tipo.nombre}">
      </a>
    </li>
  </ul>

  <!-- Formulario nueva entrada -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Nueva Entrada</h5>
      <form th:action="@{/entradas}" th:object="${entrada}" method="post" class="row g-3">
        <div class="col-md-2">
          <select th:field="*{tipo}" class="form-select">
            <option value="">-- Tipo --</option>
            <option th:each="tipo, i : ${tipos}"
                    th:value="${i.index}"
                    th:text="${tipo.nombre}">
            </option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre"/>
        </div>
        <div class="col-md-1">
          <input type="number" th:field="*{temporada}" class="form-control" placeholder="Temporada"/>
        </div>
        <div class="col-md-1">
          <input type="number" th:field="*{numeroUnidades}" class="form-control" placeholder="Nº episodios"/>
        </div>
        <div class="col-md-4">
          <input type="text" th:field="*{observaciones}" class="form-control" placeholder="Observaciones"/>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">Añadir</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lista de entradas -->
  <div class="row row-cols-1 row-cols-md-3 g-3">
    <div class="col" th:each="entrada, i : ${entradas}">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title" th:text="${entrada.nombre}"></h5>
          <p class="card-text">
            <span class="badge bg-primary" th:text="${entrada.tipo.nombre}"></span>
            <span th:if="${entrada.tipo.tieneTemporadas}" th:text="' · Temporada ' + ${entrada.temporada}"></span>
            <br/>
            <small th:text="${entrada.numeroUnidades} + ' ' + ${entrada.tipo.nombreUnidad} + 's'"></small>
            <br/>
            <small class="text-muted" th:text="${entrada.observaciones}"></small>
          </p>
        </div>
        <div class="card-footer">
          <a th:href="@{/entradas/{indice}(indice=${i.index})}" class="btn btn-primary btn-sm me-2">Ver</a>
          <a th:href="@{/entradas/eliminar/{indice}(indice=${i.index})}" class="btn btn-danger btn-sm">Eliminar</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
