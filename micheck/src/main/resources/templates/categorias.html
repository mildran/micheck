<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>MiCheck - Categorías</title>
</head>
<body>
<div layout:fragment="content">
  <h2 class="mb-4">Categorías</h2>

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Nueva Categoría</h5>
      <form th:action="@{/categorias}" th:object="${categoria}" method="post" class="row g-3">
        <div class="col-md-4">
          <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre (Serie, Comic...)"/>
        </div>
        <div class="col-md-3">
          <input type="text" th:field="*{nombreUnidad}" class="form-control" placeholder="Nombre unidad (Episodio, Tomo...)"/>
        </div>
        <div class="col-md-3 d-flex align-items-center">
          <div class="form-check">
            <input type="checkbox" th:field="*{tieneTemporadas}" class="form-check-input" id="tieneTemporadas"/>
            <label class="form-check-label" for="tieneTemporadas">¿Tiene temporadas?</label>
          </div>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">Añadir</button>
        </div>
      </form>
    </div>
  </div>

  <ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center"
        th:each="categoria, i : ${categorias}">
      <div>
        <strong th:text="${categoria.nombre}"></strong> -
        <span th:text="${categoria.tieneTemporadas} ? 'Con temporadas' : 'Sin temporadas'"></span> -
        <span th:text="${categoria.nombreUnidad}"></span>
      </div>
      <a th:href="@{/categorias/eliminar/{indice}(indice=${i.index})}" class="btn btn-danger btn-sm">Eliminar</a>
    </li>
  </ul>
</div>
</body>
</html>
